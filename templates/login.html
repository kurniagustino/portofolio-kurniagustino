<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    (function() {
      document.documentElement.classList.add('js');
      var defaultTheme = '{{ if and .Settings .Settings.Theme }}{{ .Settings.Theme }}{{ else }}dark{{ end }}';
      var t = localStorage.getItem('theme') || defaultTheme;
      if (t === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
  <style>
    :root {
      --glass-bg: rgba(255,255,255,0.72);
      --glass-border: rgba(226,232,240,0.7);
      --glass-shadow: 0 20px 50px -12px rgba(15,23,42,0.12);
    }
    .dark {
      --glass-bg: rgba(15,23,42,0.55);
      --glass-border: rgba(51,65,85,0.45);
      --glass-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
    }
    body { font-family: 'Inter', sans-serif; }
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }
    .bg-grid-slate-100 {
      background-size: 40px 40px;
      background-image: linear-gradient(to right, rgba(241,245,249,0.6) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(241,245,249,0.6) 1px, transparent 1px);
    }
    .dark .bg-grid-slate-100 {
      background-image: linear-gradient(to right, rgba(30,41,59,0.5) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(30,41,59,0.5) 1px, transparent 1px);
    }
    .fade-up { animation: fadeUp .7s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(18px) scale(.98);} to { opacity:1; transform: translateY(0) scale(1);} }
    @media (prefers-reduced-motion: reduce) { .fade-up { animation: none; } }
  </style>
  <link rel="stylesheet" href="/static/css/tailwind.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-accent-cyan selection:text-white overflow-x-hidden">
  <div class="fixed inset-0 z-[-1] bg-grid-slate-100 [mask-image:linear-gradient(to_bottom,white,transparent)]"></div>
  <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-accent-cyan/10 dark:bg-accent-cyan/[0.04] rounded-full blur-[120px] animate-pulse-slow"></div>
    <div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] bg-accent-indigo/10 dark:bg-accent-indigo/[0.04] rounded-full blur-[120px] animate-pulse-slow"></div>
  </div>

  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-12 relative">
    <a href="/" class="mb-8 text-xl font-black tracking-tight font-mono inline-flex items-center gap-1 fade-up" style="animation-delay:.05s">
      <span class="text-accent-cyan">&lt;</span><span class="dark:text-white text-slate-900">Kurnia</span><span class="text-accent-cyan">/&gt;</span>
    </a>

    <div class="glass-card fade-up w-full max-w-md rounded-2xl p-8 md:p-10 border-t-2 border-t-accent-cyan/60 relative overflow-hidden">
      <div class="absolute top-0 right-0 w-40 h-40 bg-accent-cyan/10 blur-3xl rounded-full -translate-y-1/2 translate-x-1/3 pointer-events-none"></div>
      <div class="relative">
        <p class="font-mono text-[11px] uppercase tracking-widest text-accent-cyan mb-2">./auth/login</p>
        <h1 class="text-3xl font-black tracking-tight text-slate-800 dark:text-white">Selamat Datang</h1>
        <p class="text-slate-500 dark:text-slate-400 mt-2 mb-8 text-sm">Masuk untuk mengakses dashboard admin.</p>

        <div id="errorMsg" class="hidden mb-5 p-3 rounded-lg border border-red-500/40 bg-red-500/10 text-sm text-red-600 dark:text-red-400"></div>

        <form id="loginForm" class="space-y-5">
          <div>
            <label for="username" class="block text-xs font-mono uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Username</label>
            <input type="text" id="username" name="username" required placeholder="Masukkan username"
              class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900/70 px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-accent-cyan focus:ring-2 focus:ring-accent-cyan/20 transition-all">
          </div>
          <div>
            <label for="password" class="block text-xs font-mono uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-2">Password</label>
            <input type="password" id="password" name="password" required placeholder="Masukkan password"
              class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900/70 px-4 py-3 text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-accent-cyan focus:ring-2 focus:ring-accent-cyan/20 transition-all">
          </div>
          <button type="submit" id="submitBtn"
            class="w-full mt-2 px-6 py-3 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-lg font-semibold transition-all duration-300 hover:shadow-[0_0_20px_rgba(6,182,212,0.35)] active:scale-[0.98] disabled:opacity-60 disabled:cursor-not-allowed">
            Masuk
          </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between text-xs font-mono text-slate-500">
          <a href="/" class="hover:text-accent-cyan transition-colors">← Kembali ke portfolio</a>
          <button type="button" id="theme-toggle" class="hover:text-accent-cyan transition-colors">Toggle tema</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle & sync
    (function() {
      document.getElementById('theme-toggle')?.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const newTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
      });
      window.addEventListener('storage', (e) => {
        if (e.key === 'theme' && e.newValue) {
          if (e.newValue === 'dark') document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        }
      });
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      const originalText = btn.textContent;
      btn.textContent = 'Memverifikasi...';
      btn.disabled = true;
      errEl.classList.add('hidden');

      const data = Object.fromEntries(new FormData(e.target));
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (res.ok) {
          window.location.href = '/admin';
        } else {
          errEl.textContent = result.error || 'Login gagal. Periksa username dan password.';
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        errEl.textContent = 'Terjadi kesalahan jaringan. Coba lagi.';
        errEl.classList.remove('hidden');
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
