<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --surface: #1e2128;
            --surface-light: #2a2e37;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: var(--surface);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar h2 { margin: 0; font-weight: 700; color: white; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: white; }
        .btn-outline:hover { background: var(--surface-light); }
        
        .btn-block { width: 100%; margin-top: 1rem; padding: 1rem; }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .tab-btn:hover:not(.active) {
            background: var(--surface);
            color: white;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            padding: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(255,255,255,0.02);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:hover td { background: rgba(255,255,255,0.01); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 2rem;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal { transform: translateY(0); }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        .form-control {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary); }
        textarea.form-control { resize: vertical; min-height: 100px; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 768px) { .settings-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2>Dashboard</h2>
        <button class="btn btn-outline" onclick="window.location.href='/logout'">Logout</button>
    </nav>

    <div class="container">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('projects', this)">Projects</button>
            <button class="tab-btn" onclick="switchTab('settings', this)">Site Settings</button>
        </div>

        <!-- PROJECTS TAB -->
        <div id="projects" class="tab-content active">
            <div class="header-actions">
                <h2>Manage Projects</h2>
                <button class="btn" onclick="openModal()">+ Add New Project</button>
            </div>

            <div class="card" style="padding: 0;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Tech Stack</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody">
                        <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- SETTINGS TAB -->
        <div id="settings" class="tab-content">
            <div class="header-actions">
                <h2>Global Site Settings</h2>
            </div>

            <div class="card">
                <form id="settingsForm">
                    <div class="settings-grid">
                        <div class="column">
                            <h3>Brand & Identity</h3>
                            <div class="form-group">
                                <label>Site Title (Tab Name)</label>
                                <input type="text" name="SiteTitle" id="SiteTitle" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Favicon URL (Image Link)</label>
                                <input type="text" name="Favicon" id="Favicon" class="form-control">
                            </div>
                            
                            <h3 style="margin-top: 2rem;">Hero Section</h3>
                            <div class="form-group">
                                <label>Hero Title (Main Heading)</label>
                                <input type="text" name="HeroTitle" id="HeroTitle" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Hero Subtitle</label>
                                <input type="text" name="HeroSubtitle" id="HeroSubtitle" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>About Me Text</label>
                                <textarea name="AboutText" id="AboutText" class="form-control" style="min-height: 150px;"></textarea>
                            </div>
                        </div>

                        <div class="column">
                            <h3>Social & Contact Links</h3>
                            <div class="form-group">
                                <label>GitHub Profile URL</label>
                                <input type="url" name="GithubLink" id="GithubLink" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>LinkedIn Profile URL</label>
                                <input type="url" name="LinkedInLink" id="LinkedInLink" class="form-control">
                            </div>
                            <div class="form-group">
                                <label>Contact Email (e.g., mailto:you@email.com)</label>
                                <input type="text" name="EmailLink" id="EmailLink" class="form-control">
                            </div>

                            <h3 style="margin-top: 2rem;">Footer</h3>
                            <div class="form-group">
                                <label>Footer Text (Copyright)</label>
                                <input type="text" name="FooterText" id="FooterText" class="form-control">
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-block" id="saveSettingsBtn">Save Settings</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Modal Form for Projects -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Add Project</h2>
            <form id="projectForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" required></textarea>
                </div>
                <div class="form-group">
                    <label>Tech Stack</label>
                    <input type="text" name="techstack" class="form-control">
                </div>
                <div class="form-group">
                    <label>Link (URL)</label>
                    <input type="text" name="link" class="form-control">
                </div>
                <div class="form-group">
                    <label>Images</label>
                    <input type="file" name="images" class="form-control" multiple>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // TAB LOGIC
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        // --- PROJECTS LOGIC ---
        async function fetchProjects() {
            try {
                const res = await fetch('/admin/api/projects');
                if (res.status === 401) { window.location.href = '/login'; return; }
                const data = await res.json();
                const tbody = document.getElementById('projectTableBody');
                tbody.innerHTML = '';
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No projects found</td></tr>';
                    return;
                }
                data.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.ID}</td>
                        <td><strong>${p.Title}</strong></td>
                        <td>${p.TechStack}</td>
                        <td><button class="btn btn-danger" onclick="deleteProject(${p.ID})">Delete</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) { console.error(err); }
        }

        async function deleteProject(id) {
            if (!confirm('Are you sure you want to delete this project?')) return;
            try {
                const res = await fetch(`/admin/api/projects/${id}`, { method: 'DELETE' });
                if (res.ok) fetchProjects();
            } catch (err) { console.error(err); }
        }

        const modal = document.getElementById('modalOverlay');
        const pform = document.getElementById('projectForm');
        function openModal() { modal.classList.add('active'); }
        function closeModal() { modal.classList.remove('active'); pform.reset(); }

        pform.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = 'Saving...'; btn.disabled = true;
            try {
                const res = await fetch('/admin/api/projects', {
                    method: 'POST',
                    body: new FormData(pform)
                });
                if (res.ok) { closeModal(); fetchProjects(); }
                else alert('Failed to save project');
            } finally { btn.textContent = 'Save Project'; btn.disabled = false; }
        });

        // --- SETTINGS LOGIC ---
        async function fetchSettings() {
            try {
                const res = await fetch('/admin/api/settings');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('SiteTitle').value = data.SiteTitle || '';
                    document.getElementById('Favicon').value = data.Favicon || '';
                    document.getElementById('HeroTitle').value = data.HeroTitle || '';
                    document.getElementById('HeroSubtitle').value = data.HeroSubtitle || '';
                    document.getElementById('AboutText').value = data.AboutText || '';
                    document.getElementById('FooterText').value = data.FooterText || '';
                    document.getElementById('GithubLink').value = data.GithubLink || '';
                    document.getElementById('LinkedInLink').value = data.LinkedInLink || '';
                    document.getElementById('EmailLink').value = data.EmailLink || '';
                }
            } catch (err) { console.error(err); }
        }

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveSettingsBtn');
            const originalText = btn.textContent;
            btn.textContent = 'Saving Settings...'; btn.disabled = true;

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            // convert string to numbers if necessary (not needed here)

            try {
                const res = await fetch('/admin/api/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    alert('Settings updated successfully! Check your homepage.');
                } else {
                    alert('Failed to update settings.');
                }
            } catch (err) { console.error(err); } 
            finally { btn.textContent = originalText; btn.disabled = false; }
        });

        // Init
        fetchProjects();
        fetchSettings();
    </script>
</body>
</html>
