<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --surface: #1e2128;
            --surface-light: #2a2e37;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: var(--surface);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar h2 { margin: 0; font-weight: 700; color: white; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); }
        .btn-danger:hover { background: #dc2626; }
        .btn-outline { background: transparent; border: 1px solid var(--border); }
        .btn-outline:hover { background: var(--surface-light); }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem 1.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: rgba(255,255,255,0.02);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tr:hover td {
            background: rgba(255,255,255,0.01);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 2rem;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal { transform: translateY(0); }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
        .form-control {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary); }
        textarea.form-control { resize: vertical; min-height: 100px; }
        
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h2>Dashboard</h2>
        <button class="btn btn-outline" onclick="window.location.href='/logout'">Logout</button>
    </nav>

    <div class="container">
        <div class="header-actions">
            <h1>Projects</h1>
            <button class="btn" onclick="openModal()">+ Add New Project</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Tech Stack</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="projectTableBody">
                    <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">Add Project</h2>
            <form id="projectForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-control" required></textarea>
                </div>
                <div class="form-group">
                    <label>Tech Stack</label>
                    <input type="text" name="techstack" class="form-control">
                </div>
                <div class="form-group">
                    <label>Link (URL)</label>
                    <input type="text" name="link" class="form-control">
                </div>
                <div class="form-group">
                    <label>Images</label>
                    <input type="file" name="images" class="form-control" multiple>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save Project</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function fetchProjects() {
            try {
                const res = await fetch('/admin/api/projects');
                if (res.status === 401) { window.location.href = '/login'; return; }
                const data = await res.json();
                
                const tbody = document.getElementById('projectTableBody');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No projects found</td></tr>';
                    return;
                }

                data.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${p.ID}</td>
                        <td><strong>${p.Title}</strong></td>
                        <td>${p.TechStack}</td>
                        <td>
                            <button class="btn btn-danger" onclick="deleteProject(${p.ID})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) { console.error(err); }
        }

        async function deleteProject(id) {
            if (!confirm('Are you sure you want to delete this project?')) return;
            try {
                const res = await fetch(`/admin/api/projects/${id}`, { method: 'DELETE' });
                if (res.ok) fetchProjects();
            } catch (err) { console.error(err); }
        }

        // Modal Logic
        const modal = document.getElementById('modalOverlay');
        const form = document.getElementById('projectForm');

        function openModal() { modal.classList.add('active'); }
        function closeModal() { 
            modal.classList.remove('active'); 
            form.reset(); 
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.textContent = 'Saving...';
            btn.disabled = true;

            const formData = new FormData(form);
            try {
                const res = await fetch('/admin/api/projects', {
                    method: 'POST',
                    body: formData
                });
                
                if (res.ok) {
                    closeModal();
                    fetchProjects();
                } else {
                    alert('Failed to save project');
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.textContent = 'Save Project';
                btn.disabled = false;
            }
        });

        // Init
        fetchProjects();
    </script>
</body>
</html>
